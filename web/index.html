<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamCamel</title>
<style>
  :root {
    --bg: #E6EECF;
    --ink: #15180E;
    --muted: #586050;
    --attn: #9A2B14;
    --work: #1553B5;
    --rule: #C7D1AA;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, sans-serif;
    padding: 18px 16px 72px;   /* bottom clears the fixed footer */
  }
  @media (min-width: 720px) { body { padding: 22px 40px 80px; } }

  /* Four weights, heaviest to lightest: node, ws, session, status. */
  .node h1 { font-weight: 900; }
  .ws h2 { font-weight: 700; }
  .name { font-weight: 500; }
  .status { font-weight: 300; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: flex-end;
    font-size: 14px; font-weight: 300; color: var(--muted); margin-bottom: 18px;
  }
  .bar .attn { color: var(--attn); }
  .bar .work { color: var(--work); }
  .bar .err { color: var(--attn); font-weight: 500; margin-right: auto; }

  .nodes {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 36px 64px; align-items: start;
  }
  .node.stale { opacity: .55; }
  .node h1 { font-size: 19px; margin: 0 0 4px; }
  .node h1 .upd { font-weight: 300; font-size: 16px; margin-left: 8px; white-space: nowrap; }
  .none { font-weight: 300; color: var(--muted); margin: 14px 0 0 18px; }
  /* "on others": one line saying how fresh each node's report is */
  .fresh {
    display: flex; flex-wrap: wrap; gap: 2px 18px; margin: 2px 0 0 18px;
    font-size: 14px; font-weight: 300; color: var(--muted);
  }

  .ws.stale { opacity: .55; }
  .ws h2 { font-size: 17px; margin: 22px 0 12px 18px; overflow-wrap: anywhere; }
  .ws h2 .on { font-weight: 400; font-size: 15px; color: var(--muted); margin-left: 10px; white-space: nowrap; }
  /* says which program a session belongs to; shown when the page has sessions of both */
  .app { font-weight: 400; font-size: 12px; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px;
         padding: 0 5px 1px; margin-left: 8px; white-space: nowrap; vertical-align: 1px; }
  .s { margin: 0 0 14px 46px; overflow-wrap: anywhere; }
  .name { display: block; color: inherit; text-decoration: none; }
  a.name:hover { text-decoration: underline; }
  .status { color: var(--muted); }
  .s.input .status, .s.interrupted.attention .status { color: var(--attn); }
  .s.working .status { color: var(--work); }

  .more {
    font: inherit; font-size: 22px; font-weight: 500; line-height: 1; color: var(--muted);
    letter-spacing: 2px; background: none; border: 0; padding: 0 12px 10px 0; margin: -8px 0 0;
    cursor: pointer;
  }
  .more:hover, .more:focus-visible { color: var(--ink); }
  .more:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .rest .s { opacity: .8; }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); border-top: 1px solid var(--rule);
    font-size: 13px; font-weight: 300; color: var(--muted); text-align: center;
  }
  /* The TeamCamel logo: shapes only (lettering traced from PT Sans), so it needs no font. */
  .logo { height: 14.4px; width: auto; fill: var(--ink); vertical-align: baseline; margin-right: 1px; }

  /* Versions of Claude Code and Codex next to a computer's name. */
  .apps { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 2px 0 0 18px; font-size: 13px; font-weight: 300; color: var(--muted); }
  .chip { font-weight: 400; border-radius: 4px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
  .chip.new { background: #C0DD97; color: #173404; }
  .chip.near { background: #D3D1C7; color: #2C2C2A; }
  .chip.old { background: #F7C1C1; color: #501313; }
  .fresh .chip { font-size: 12px; }

  /* The gear and the settings panel. */
  .gear { font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; padding: 0 4px; margin-right: auto;
          color: var(--muted); cursor: pointer; }
  .gear:hover, .gear:focus-visible { color: var(--ink); }
  .gear:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .panel { position: fixed; top: 44px; left: 12px; z-index: 10; width: min(380px, calc(100vw - 24px));
           max-height: calc(100vh - 110px); overflow-y: auto; background: #fff; color: #15180E;
           border: 1px solid var(--rule); border-radius: 8px; padding: 12px 16px 14px; font-size: 15px; font-weight: 400;
           box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .panel h3 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; }
  .panel h3:first-of-type { margin-top: 4px; }
  .panel label { display: inline-flex; align-items: center; gap: 6px; margin: 2px 14px 2px 0; }
  .panel .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .panel .row .who { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .panel .note { color: #586050; font-size: 13px; font-weight: 300; margin: 2px 0 6px; }
  .panel button { font: inherit; font-size: 13px; background: none; border: 1px solid #586050; border-radius: 4px;
                  padding: 1px 8px; color: #15180E; cursor: pointer; }
  .panel .close { float: right; border: 0; font-size: 20px; line-height: 1; padding: 0 2px; }
  .panel input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid var(--rule); background: none; }
  .panel .colors label { display: flex; justify-content: space-between; margin: 3px 0; }
  .panel .line { display: flex; flex-wrap: wrap; align-items: center; margin: 2px 0; }
  .panel .lead { font-weight: 500; margin-right: 10px; min-width: 70px; }
  .panel .sub { margin: 0 0 6px 24px; }

  /* Opened as a file (double-clicked) instead of at TeamCamel's address: the setup guide. */
  .guide { display: block; max-width: 780px; }
  .guide h1 { font-size: 24px; font-weight: 900; margin: 0 0 4px; }
  .guide h2 { font-size: 18px; font-weight: 700; margin: 26px 0 8px; }
  .guide p { margin: 0 0 8px; }
  .guide .lead, .guide .note { color: var(--muted); font-weight: 300; }
  .guide .state { font-weight: 500; margin: 14px 0 0; }
  .guide .no, .guide .warn b { color: var(--attn); }
  .guide .open, .guide .open a, .guide .state a { color: var(--work); }
  .guide .warn { border-left: 3px solid var(--attn); padding: 2px 0 2px 10px; }
  .guide .warn b { font-weight: 500; }
  .guide .where { overflow-wrap: anywhere; }
  .cmd { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; }
  .cmd code { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px;
              font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: all; }
  .cmd button { font: inherit; font-size: 14px; background: none; border: 1px solid var(--muted); border-radius: 4px;
                padding: 4px 12px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .cmd button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<aside class="panel" id="settings" hidden aria-label="Settings"></aside>
<main class="nodes" id="nodes"></main>

1.58-1.63-3-2.57c-1.41-.94-3.21-1.21-4.28-2.14-1.07-.93-1.4-1.45-1.93-2.78s-.75-3.14-.86-5.56c-.11-2.42.19-4.95.43-6.63.24-1.69.33-2.23.86-3.85.52-1.62,1.21-2.5,1.93-4.49.71-1.99,1.03-2.87,1.5-5.14.47-2.26.57-3.87.86-6.85.29-2.98.98-16.8,1.28-19.05.31-2.25.7-3.81,1.07-5.14.37-1.32.49-1.75,1.07-3,.58-1.24,1-2.24,2.14-3.64,1.14-1.4,2.61-2.81,4.28-3.85,1.67-1.04,2.36-1.25,4.28-1.71s2.69-.55,4.71-.43c2.02.12,3.54.54,4.92,1.07,1.38.53,1.85.78,3,1.71,1.14.93,2.41,2.44,3.21,3.64.8,1.19.98,1.65,1.5,3,.52,1.35.72,2.16,1.07,3.85.35,1.69.6,3.51.86,6.21.26,2.7.94,20.85,1.28,23.11.34,2.26.52,2.99,1.28,5.14.77,2.15,2.72,4.97,3.42,7.28.7,2.31.76,3.14.86,5.56.1,2.42.14,5.32-.64,9.2-.78,3.89-3.09,8.69-3.21,9.42-.12.72-.13.99,0,1.71.13.72.17,1.12.64,1.71.47.59,1.01,1.01,1.93,1.28.92.28,24.56.23,25.04,0s.67-.54.86-1.07c.19-.53.1-.87,0-1.5-.1-.63-.38-1.97-1.07-3.21-.69-1.24-1.03-1.68-2.14-2.57-1.11-.89-4.44-2.15-5.35-2.78s-1.34-.98-1.93-1.71-7.99-50.41,10.88-55.97c1.27-.49,7.07-2.13,11.59-7.26,7.25-4.83,7.43-20.47,7.26-21.74-.17-1.27-.24-4.74.01-5.06s13.86-.71,17.52-4.12c.79.19,4.68,3.84,8.35,3.21,1.99,1.24,7.71-5.69,3.88-11.1,0,0-.25-10.52-10.49-10.3Z"/><path class="letters" d="M718.43 660.63Q712.49 665.18 703.38 666.96Q694.28 668.75 683.99 668.75Q671.52 668.75 660.63 664.49Q649.74 660.23 641.63 651.53Q633.51 642.82 628.76 629.26Q624.01 615.70 624.01 597.09Q624.01 577.70 629.26 564.14Q634.50 550.58 643.11 541.97Q651.72 533.36 662.41 529.40Q673.10 525.44 684.18 525.44Q696.06 525.44 703.58 526.73Q711.10 528.02 716.45 530.19L712.49 544.64Q702.99 540.09 685.37 540.09Q677.26 540.09 669.34 543.06Q661.42 546.03 655.19 552.76Q648.95 559.49 645.19 570.37Q641.43 581.26 641.43 597.09Q641.43 611.35 644.99 622.03Q648.56 632.72 654.79 639.85Q661.03 646.97 669.44 650.54Q677.85 654.10 687.75 654.10Q696.65 654.10 703.29 652.32Q709.92 650.54 714.47 647.76ZM803.14 627.97L752.07 627.97L738.22 666.37L721.99 666.37L774.44 525.64L781.96 525.64L834.61 666.37L817.39 666.37ZM757.42 613.72L798.19 613.72L782.75 <script>
const STALE_FACTOR = 2.4;   // a node is "not reporting" after this many missed heartbeats
const RANK = s => s.state === 'input' ? 0 : (s.state === 'interrupted' && s.attention) ? 1
                : s.state === 'working' ? 2 : 3;

let data = null, failed = false, timer = null, pollMs = 15000, pageStamp = null;
let bothApps = false;       // Claude and Codex sessions are both on the page: label each session
let view = null;            // the settings the page was last drawn with
let opened = new Set();
try { opened = new Set(JSON.parse(localStorage.getItem('teamcamel.open') || '[]')); } catch (e) {}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function age(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 45) return s + ' s';
  if (s < 90 * 60) return Math.round(s / 60) + ' min';
  if (s < 36 * 3600) return Math.round(s / 3600) + ' h';
  if (s < 60 * 86400) return Math.round(s / 86400) + ' d';
  return Math.round(s / (30 * 86400)) + ' mo';
}

function statusText(s, now) {
  const t = s.since ? age(now - s.since) : '';
  if (s.state === 'input') {
    const what = s.detail && s.detail !== 'input needed' ? ' (' + s.detail + ')' : '';   // e.g. permission prompt, approval
    return 'awaits input' + what + (t ? '  · ' + t : '');
  }
  if (s.state === 'working') return 'working' + (s.detail ? ' ' + s.detail : '') + (t ? '  · ' + t : '');   // e.g. in background (blender)
  if (s.state === 'interrupted') return (s.detail || 'interrupted') + (t ? '  · ' + t + ' ago' : '');
  return 'completed' + (t ? '  · ' + t + ' ago' : '');
}

function sessionEl(s, local, now) {
  const box = el('div', 's ' + s.state + (s.attention ? ' attention' : ''));
  let name;
  const app = s.app === 'codex' ? 'Codex' : 'Claude';
  if (local && s.link) {
    name = el('a', 'name', s.title);
    name.href = s.link;
    name.title = 'Open in ' + app;
  } else {
    name = el('span', 'name', s.title);
  }
  if (bothApps) name.append(el('span', 'app', app));
  box.append(name, el('div', 'status', statusText(s, now)));
  return box;
}

// p: the prepared node this workspace is on; tagged: name that node in the heading.
function wsEl(p, ws, now, tagged) {
  const box = el('section', 'ws' + (tagged && p.stale ? ' stale' : ''));
  const h = el('h2', '', 'ws ' + ws.name);
  if (tagged) h.append(el('span', 'on', 'on ' + p.node.node));
  box.append(h);
  // Shown: everything that needs you, everything still working, the newest completed one.
  const shown = [], rest = [];
  let completedShown = false;
  for (const s of ws.sessions) {
    if (RANK(s) < 3) shown.push(s);
    else if (!completedShown) { shown.push(s); completedShown = true; }
    else rest.push(s);
  }
  for (const s of shown) box.append(sessionEl(s, p.local, now));
  if (rest.length) {
    const key = p.node.node + '/' + ws.name;
    const more = el('button', 'more', '. . .');
    const drawer = el('div', 'rest');
    for (const s of rest) drawer.append(sessionEl(s, p.local, now));
    const set = isOpen => {
      drawer.hidden = !isOpen;
      more.setAttribute('aria-expanded', String(isOpen));
      more.title = (isOpen ? 'Hide ' : 'Show ') + rest.length + ' more';
    };
    set(opened.has(key));
    more.addEventListener('click', () => {
      opened.has(key) ? opened.delete(key) : opened.add(key);
      try { localStorage.setItem('teamcamel.open', JSON.stringify([...opened])); } catch (e) {}
      set(opened.has(key));
    });
    box.append(more, drawer);
  }
  return box;
}

function groupByWs(sessions) {
  const map = new Map();
  for (const s of sessions) {
    if (!map.has(s.ws)) map.set(s.ws, []);
    map.get(s.ws).push(s);
  }
  const list = [...map].map(([name, ss]) => {
    ss.sort((a, b) => RANK(a) - RANK(b) || (b.since || 0) - (a.since || 0));
    return {
      name, sessions: ss,
      attention: ss.filter(s => s.attention).length,
      working: ss.filter(s => s.state === 'working').length,
      latest: Math.max(...ss.map(s => s.since || 0)),
    };
  });
  list.sort(byUrgency);
  return list;
}

// Most sessions needing you first, then most still working, then most recent activity.
function byUrgency(a, b) {
  return b.attention - a.attention || b.working - a.working || b.latest - a.latest;
}

function prep(node, now) {
  const local = node.node === data.self;
  const stale = !local && now - node.generatedAt > data.heartbeatSec * 1000 * STALE_FACTOR;
  const wss = groupByWs(node.sessions);
  return {
    node, local, stale, wss,
    attention: wss.reduce((n, w) => n + w.attention, 0),
    at: new Date(node.generatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
    ago: age(now - node.generatedAt),
  };
}

// Hover text for a node: computer name, operating system, TeamCamel version.
function about(node) {
  return [node.host, node.os, node.version && 'TeamCamel ' + node.version].filter(Boolean).join(' · ');
}

function nodeColumn(p, now) {
  const col = el('section', 'node' + (p.stale ? ' stale' : ''));
  const h = el('h1', '', 'on ' + p.node.node + ' (' + p.attention + ')');
  h.append(el('span', 'upd', p.stale
    ? '[not reporting since ' + p.at + ', ' + p.ago + ' ago]'
    : '[updated: ' + p.at + ', ' + p.ago + ' ago]'));
  h.title = about(p.node);
  col.append(h);
  const apps = view && view.versions ? appsEl(p.node, view) : null;
  if (apps) col.append(apps);
  if (!p.wss.length) col.append(el('div', 'none', 'no sessions'));
  for (const ws of p.wss) col.append(wsEl(p, ws, now, false));
  return col;
}

// Several other nodes share one column: their workspaces are interleaved by urgency,
// each heading saying which node it is on. A node that stopped reporting sinks to the bottom.
function othersColumn(ps, now) {
  const col = el('section', 'node');
  const attention = ps.reduce((n, p) => n + (p.stale ? 0 : p.attention), 0);
  col.append(el('h1', '', 'on others (' + attention + ')'));
  const fresh = el('div', 'fresh');
  for (const p of ps) {
    const item = el('span', '', p.node.node + (p.node.os ? ' (' + p.node.os + ')' : '') + (p.stale
      ? ': not reporting since ' + p.at : ': updated ' + p.ago + ' ago'));
    item.title = about(p.node);
    const apps = view && view.versions ? appsEl(p.node, view, 'versions') : null;
    if (apps) item.append(' ', apps);
    fresh.append(item);
  }
  col.append(fresh);
  const groups = [];
  for (const p of ps) for (const ws of p.wss) groups.push({ p, ws });
  groups.sort((a, b) => a.p.stale - b.p.stale || byUrgency(a.ws, b.ws));
  if (!groups.length) col.append(el('div', 'none', 'no sessions'));
  for (const g of groups) col.append(wsEl(g.p, g.ws, now, true));
  return col;
}

// ---- Settings ---------------------------------------------------------------------------------
// Either this computer's own or the ones for all computers; teamcamel.py keeps both in the shared
// TeamCamel folder and sends them with the page data, so every browser on a computer sees the same.

const DEFAULTS = {
  order: [], hidden: [],
  apps: { claude: true, codex: true },
  systems: { macOS: true, Windows: true, Linux: true },
  versions: true, online: false,
  colors: { bg: '#E6EECF', attn: '#9A2B14', work: '#1553B5', muted: '#586050' },
  notify: { popup: false, sound: false, title: false },
};
const MINE = 'teamcamel.settings';       // where 2.0 kept this computer's settings, in one browser only
const LAST = 'teamcamel.lastSettings';   // the last settings drawn with: for the first moment, before the page data

function complete(s) {
  s = s && typeof s === 'object' ? s : {};
  const out = JSON.parse(JSON.stringify(DEFAULTS));
  for (const k of ['order', 'hidden']) if (Array.isArray(s[k])) out[k] = s[k].filter(x => typeof x === 'string');
  for (const k of ['apps', 'systems', 'colors', 'notify'])
    if (s[k] && typeof s[k] === 'object') for (const n in out[k]) if (typeof s[k][n] === typeof out[k][n]) out[k][n] = s[k][n];
  for (const k of ['versions', 'online']) if (typeof s[k] === 'boolean') out[k] = s[k];
  return out;
}

function mine() { return (data && data.mySettings) || null; }

// 'mine': this computer's own settings are in force; 'shared': the ones for all computers.
function scope() { return mine() ? 'mine' : (data && data.settings) ? 'shared' : 'mine'; }

function settings() {
  if (data) return complete(mine() || data.settings || null);
  try { return complete(JSON.parse(localStorage.getItem(LAST) || 'null')); } catch (e) { return complete(null); }
}

// True once TeamCamel has kept them. A TeamCamel older than this page (it restarts on its own
// a moment after the page reloads) cannot keep them; until then they are not sent.
async function save(s, where) {
  where = where || scope();
  if (data && !data.settingsScopes) { render(); return false; }
  if (data) {
    if (where === 'mine') data.mySettings = s;
    else { data.settings = s; data.mySettings = null; }
  }
  render();
  try {
    const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-TeamCamel': '1' },
                                             body: JSON.stringify({ scope: where, settings: s }) });
    if (!r.ok) return false;
    const kept = await r.json();
    if (data) { Object.assign(data, kept); render(); }
    return 'mySettings' in kept;
  } catch (e) { return false; }
}

// 2.0 kept "only this computer" settings in one browser: hand them over to TeamCamel, once, and
// let go of the browser's copy only when TeamCamel has kept them.
let adopting = false;
async function adoptOldSettings() {
  if (adopting || !data.settingsScopes) return;
  let old = null;
  try { old = localStorage.getItem(MINE); } catch (e) {}
  if (!old) return;
  const drop = () => { try { localStorage.removeItem(MINE); } catch (e) {} };
  if (data.mySettings) return drop();      // this computer already has its own: another browser handed them over
  let s;
  try { s = complete(JSON.parse(old)); } catch (e) { return drop(); }
  adopting = true;
  if (await save(s, 'mine')) drop();
  adopting = false;
}

function applyColors(c) {
  const root = document.documentElement.style;
  root.setProperty('--bg', c.bg); root.setProperty('--attn', c.attn);
  root.setProperty('--work', c.work); root.setProperty('--muted', c.muted);
}

function systemOf(node) {
  const os = String(node.os || '');
  return os.startsWith('macOS') ? 'macOS' : os.startsWith('Windows') ? 'Windows' : 'Linux';
}

// The chosen order first; computers not in it after, as they come (this computer first).
function ordered(nodes, s) {
  const at = name => { const i = s.order.indexOf(name); return i < 0 ? s.order.length : i; };
  return nodes.map((n, i) => [n, i]).sort((a, b) => at(a[0].node) - at(b[0].node) || a[1] - b[1]).map(x => x[0]);
}

// ---- Versions -------------------------------------------------------------------------------
// Green: the latest. Grey: not the latest. Red: may be outdated, that is behind a big version:
// for Claude Code its first two numbers (2.1); Codex is still at 0.x and moves its second number
// almost weekly, so for it 4 releases (about a month).

let online = null;   // latest versions from the npm registry, when the setting allows the look-up
try { online = JSON.parse(localStorage.getItem('teamcamel.newest') || 'null'); } catch (e) {}

function parseVersion(v) {
  const m = /(\d+)\.(\d+)(?:\.(\d+))?/.exec(String(v || ''));
  return m ? [+m[1], +m[2], +(m[3] || 0)] : null;
}

function compareVersions(a, b) {
  for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
  return 0;
}

function versionMark(app, version, newest) {
  const a = parseVersion(version), n = parseVersion(newest);
  if (!a || !n || compareVersions(a, n) >= 0) return 'new';
  if (app === 'codex' && a[0] === 0 && n[0] === 0) return n[1] - a[1] >= 4 ? 'old' : 'near';
  return a[0] === n[0] && a[1] === n[1] ? 'near' : 'old';
}

function newestOf(app, s) {
  const seen = data.nodes.map(n => (n.apps || {})[app]).filter(parseVersion);
  if (s.online && online && online[app]) seen.push(online[app]);
  return seen.reduce((best, v) => !best || compareVersions(parseVersion(v), parseVersion(best)) > 0 ? v : best, null);
}

async function lookUpNewest() {
  if (online && Date.now() - online.at < 86400000) return;
  const get = async name => (await (await fetch('https://registry.npmjs.org/' + name + '/latest', { cache: 'no-store' })).json()).version;
  try {
    const [claude, codex] = await Promise.all([get('@anthropic-ai/claude-code'), get('@openai/codex')]);
    online = { at: Date.now(), claude, codex };
    try { localStorage.setItem('teamcamel.newest', JSON.stringify(online)); } catch (e) {}
    render();
  } catch (e) {}   // offline or refused: the latest seen on your computers stands
}

function appsEl(node, s, cls) {
  const box = el('span', cls || 'apps');
  for (const [app, label] of [['claude', 'Claude'], ['codex', 'Codex']]) {
    const v = (node.apps || {})[app];
    if (!v || !s.apps[app]) continue;
    const newest = newestOf(app, s), mark = versionMark(app, v, newest);
    const shown = (/\d+\.\d+(?:\.\d+)?/.exec(v) || [v])[0];
    const chip = el('span', 'chip ' + mark, shown);
    chip.title = v + (mark === 'new' ? ': the latest' : mark === 'near' ? ': not the latest, ' + newest + ' is'
                      : ': may be outdated, ' + newest + ' is the latest') +
      (s.online && online ? ' (published version, checked ' + age(Date.now() - online.at) + ' ago)' : ' (latest seen on your computers)');
    const item = el('span', '', label);
    item.append(chip);
    box.append(item);
  }
  return box.childNodes.length ? box : null;
}

// ---- Notifications --------------------------------------------------------------------------
// When a session starts needing you, in any of the ways chosen: a pop-up notice, a sound, a
// blinking tab title. They work while the page is open in a browser tab, also in the background.

let needing = null, blink = null, audio = null;

function notifyWanted(s) { return s.notify.popup || s.notify.sound || s.notify.title; }

function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    [0, 0.18].forEach((t, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = i ? 880 : 660;
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.2, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.16);
      o.connect(g).connect(audio.destination);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.17);
    });
  } catch (e) {}
}

// Blinks until you come back to the page; never while you are looking at it, except to show
// what it looks like ("Try it"), and then for a few seconds.
function startBlink(trial) {
  if (blink || (!trial && !document.hidden && document.hasFocus())) return;
  let on = false, flips = 0;
  blink = setInterval(() => {
    on = !on;
    document.title = on ? '● Needs you' : titleText;
    if (trial && ++flips >= 10) stopBlink();
  }, 700);
}

function stopBlink() {
  if (blink) { clearInterval(blink); blink = null; document.title = titleText; }
}

function announce(list, s, trial) {
  if (!list.length) return;
  const first = list[0];
  const text = first.s.title + ': ' + statusText(first.s, Date.now()).split('  · ')[0] + ', on ' + first.node +
               (list.length > 1 ? ' (and ' + (list.length - 1) + ' more)' : '');
  if (s.notify.popup && 'Notification' in window && Notification.permission === 'granted') {
    const n = new Notification('TeamCamel: a session needs you', { body: text, tag: 'teamcamel' });
    n.onclick = () => { window.focus(); n.close(); };
  }
  if (s.notify.sound) beep();
  if (s.notify.title) startBlink(trial);
}

// Sessions that need you now and did not at the last look; nothing on the first look.
function watch(shown, s) {
  const now = new Map();
  for (const p of shown) if (!p.stale) for (const ws of p.wss) for (const x of ws.sessions)
    if (x.attention) now.set(p.node.node + '/' + x.id, { s: x, node: p.node.node });
  if (needing && notifyWanted(s)) announce([...now].filter(([k]) => !needing.has(k)).map(([, v]) => v), s);
  needing = new Set(now.keys());
}

let titleText = 'TeamCamel';
document.addEventListener('visibilitychange', () => { if (!document.hidden) stopBlink(); });
window.addEventListener('focus', stopBlink);

// ---- The settings panel ----------------------------------------------------------------------

function toggle(label, checked, onChange) {
  const box = el('label'), input = el('input');
  input.type = 'checkbox'; input.checked = checked;
  input.addEventListener('change', () => onChange(input.checked, input));
  box.append(input, label);
  return box;
}

function buildPanel() {
  const panel = document.getElementById('settings');
  const s = settings(), where = scope();
  const change = fn => { const t = settings(); fn(t); return save(t); };
  const close = el('button', 'close', '×');
  close.type = 'button'; close.title = 'Close'; close.addEventListener('click', closePanel);
  panel.replaceChildren(close);

  panel.append(el('h3', '', 'Settings apply to'));
  for (const [value, label] of [['shared', 'all my computers'], ['mine', 'only this computer']]) {
    const box = el('label'), input = el('input');
    input.type = 'radio'; input.name = 'scope'; input.checked = where === value;
    input.addEventListener('change', () => { save(settings(), value).then(buildPanel); });
    box.append(input, label);
    panel.append(box);
  }
  panel.append(el('p', 'note', where === 'mine'
    ? 'Used by every browser on this computer; the other computers keep theirs.'
    : 'Every computer that has not chosen its own follows them, in every browser.'));

  if (data && data.nodes.length > 1) {
    panel.append(el('h3', '', 'Computers'));
    panel.append(el('p', 'note', 'The first one shown fills the left column; the rest share the right one.'));
    const names = ordered(data.nodes, s).map(n => n.node);
    names.forEach((name, i) => {
      const row = el('div', 'row');
      const show = toggle('', !s.hidden.includes(name), on => change(t => {
        t.hidden = t.hidden.filter(x => x !== name); if (!on) t.hidden.push(name);
      }));
      const who = el('span', 'who', name + (name === data.self ? ' (this computer)' : ''));
      const move = (dir, text) => {
        const b = el('button', '', text); b.type = 'button'; b.title = dir < 0 ? 'Move up' : 'Move down';
        b.disabled = (dir < 0 && i === 0) || (dir > 0 && i === names.length - 1);
        b.addEventListener('click', () => change(t => {
          const list = names.slice(); [list[i], list[i + dir]] = [list[i + dir], list[i]]; t.order = list;
        }).then(buildPanel));
        return b;
      };
      row.append(show, who, move(-1, '↑'), move(1, '↓'));
      panel.append(row);
    });
  }

  panel.append(el('h3', '', 'Show'));
  const sessions = el('div', 'line');
  sessions.append(el('span', 'lead', 'Sessions:'),
                  toggle('Claude', s.apps.claude, on => change(t => { t.apps.claude = on; })),
                  toggle('Codex', s.apps.codex, on => change(t => { t.apps.codex = on; })));
  const versions = el('div', 'sub');
  versions.append(toggle('Versions of Claude and Codex', s.versions, on => change(t => { t.versions = on; })),
    el('div'),
    toggle('Look up the latest versions online, once a day', s.online, on => {
      change(t => { t.online = on; }); if (on) lookUpNewest();
    }),
    el('p', 'note', 'Asks the public npm registry, where Claude Code and Codex are published, for their latest ' +
      'version numbers; nothing about you or your sessions is sent. When off, the latest version seen on your computers counts as latest.'));
  const key = el('p', 'note');
  key.append(el('span', 'chip new', 'latest'), ' ', el('span', 'chip near', 'not the latest'), ' ',
             el('span', 'chip old', 'may be outdated'));
  versions.append(key);
  const systems = el('div', 'line');
  systems.append(el('span', 'lead', 'OS(es):'));
  for (const sys of ['macOS', 'Windows', 'Linux'])
    systems.append(toggle(sys, s.systems[sys], on => change(t => { t.systems[sys] = on; })));
  panel.append(sessions, versions, systems);

  panel.append(el('h3', '', 'Colors'));
  const colors = el('div', 'colors');
  for (const [k, label] of [['bg', 'Background'], ['attn', 'Awaits input and interrupted'], ['work', 'Working'],
                             ['muted', 'Completed, and quieter text']]) {
    const box = el('label'), input = el('input');
    input.type = 'color'; input.value = s.colors[k];
    input.addEventListener('input', () => applyColors(Object.assign({}, settings().colors, { [k]: input.value })));
    input.addEventListener('change', () => change(t => { t.colors[k] = input.value; }));
    box.append(label, input);
    colors.append(box);
  }
  const reset = el('button', '', 'Reset colors'); reset.type = 'button';
  reset.addEventListener('click', () => change(t => { t.colors = Object.assign({}, DEFAULTS.colors); }).then(buildPanel));
  panel.append(colors, reset);

  panel.append(el('h3', '', 'When a session starts needing you'));
  const permission = el('p', 'note');
  const showPermission = () => {
    permission.textContent = !('Notification' in window) ? 'This browser shows no pop-up notices.'
      : Notification.permission === 'denied' ? 'Pop-up notices are blocked for this page in the browser settings.'
      : Notification.permission === 'default' && settings().notify.popup ? 'The browser will ask to allow notices.' : '';
  };
  panel.append(
    toggle('Pop-up notice', s.notify.popup, on => {
      change(t => { t.notify.popup = on; });
      if (on && 'Notification' in window && Notification.permission === 'default')
        Notification.requestPermission().then(showPermission);
      showPermission();
    }),
    toggle('Sound', s.notify.sound, on => { change(t => { t.notify.sound = on; }); if (on) beep(); }),
    toggle('Blinking tab title', s.notify.title, on => change(t => { t.notify.title = on; })));
  showPermission();
  const test = el('button', '', 'Try it'); test.type = 'button';
  test.addEventListener('click', () => announce([{ s: { title: 'A session', state: 'input', detail: 'permission prompt' },
                                                  node: data ? data.self : 'this computer' }], settings(), true));
  panel.append(permission, test,
    el('p', 'note', 'These work while this page is open in a browser tab, also when the tab is in the background.'));

  const all = el('button', '', 'Reset all settings'); all.type = 'button';
  all.style.marginTop = '14px';
  all.addEventListener('click', () => { save(complete(null)).then(buildPanel); });
  panel.append(el('div'), all);
}

function openPanel() { buildPanel(); document.getElementById('settings').hidden = false; }
function closePanel() { document.getElementById('settings').hidden = true; }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
document.addEventListener('click', e => {
  const panel = document.getElementById('settings');
  // composedPath: a click on a control the panel has since redrawn still counts as inside it
  if (!panel.hidden && !e.composedPath().includes(panel) && !e.target.closest('.gear')) closePanel();
});

function render() {
  const bar = document.getElementById('bar'), main = document.getElementById('nodes');
  bar.replaceChildren();
  const gear = el('button', 'gear', '⚙');
  gear.type = 'button'; gear.title = 'Settings'; gear.setAttribute('aria-label', 'Settings');
  gear.addEventListener('click', () => document.getElementById('settings').hidden ? openPanel() : closePanel());
  bar.append(gear);
  if (failed) bar.append(el('span', 'err', 'TeamCamel collector is not answering on this computer'));
  bar.append(el('span', 'attn', 'awaits input / interrupted'), el('span', 'work', 'working'),
             el('span', '', 'completed'));
  const s = settings();
  applyColors(s.colors);
  if (!data) return;
  view = s;
  try { localStorage.setItem(LAST, JSON.stringify(s)); } catch (e) {}

  const now = Date.now();
  // Computers in the chosen order, without the hidden ones; sessions of the apps chosen.
  const nodes = ordered(data.nodes, s).filter(n => !s.hidden.includes(n.node) && s.systems[systemOf(n)] !== false)
    .map(n => Object.assign({}, n, { sessions: n.sessions.filter(x => s.apps[x.app === 'codex' ? 'codex' : 'claude']) }));
  const all = nodes.flatMap(node => node.sessions);
  bothApps = all.some(x => x.app === 'codex') && all.some(x => x.app !== 'codex');
  const ps = nodes.map(node => prep(node, now));
  const total = ps.reduce((n, p) => n + (p.stale ? 0 : p.attention), 0);
  // Left: the first computer in the order (this one, unless chosen otherwise). Right: the next
  // one, or all the others together.
  const cols = ps.slice(0, 1).map(p => nodeColumn(p, now));
  const others = ps.slice(1);
  if (others.length === 1) cols.push(nodeColumn(others[0], now));
  else if (others.length > 1) cols.push(othersColumn(others, now));
  if (!ps.length) cols.push(el('div', 'none', 'Every computer is hidden by the settings (the gear, top left).'));
  main.replaceChildren(...cols);
  titleText = (total ? '(' + total + ') ' : '') + 'TeamCamel';
  if (!blink) document.title = titleText;
  watch(ps, s);
}

async function refresh() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    failed = false;
    // The page file itself changed (edited on any node): load the new one.
    if (pageStamp === null) pageStamp = data.page;
    else if (data.page && data.page !== pageStamp) { location.reload(); return; }
    pollMs = (data.pollSec || 15) * 1000;
    // A tester copy has no copyright line; then the version follows the logo directly.
    const sep = document.getElementById('credit') ? ' · ' : ' ';
    document.getElementById('ver').textContent = data.version ? sep + 'Ver. ' + data.version : '';
    adoptOldSettings();
    if (settings().online) lookUpNewest();
  } catch (e) {
    failed = true;
  }
  render();
}

function schedule() {
  clearTimeout(timer);
  // No polling while the tab is in the background, unless it is to tell you when a session needs you.
  if (document.hidden && !notifyWanted(settings())) return;
  timer = setTimeout(async () => { await refresh(); schedule(); }, pollMs);
}

// ---- Opened as a file -------------------------------------------------------------------------
// A double-clicked index.html has no TeamCamel behind it, so it shows how to set TeamCamel up for
// the folder it sits in, and notices when TeamCamel starts running on this computer.

// Words in a folder's path that mean it syncs between computers (SYNC_NAMES in teamcamel.py).
const SYNCED = [['dropbox', 'Dropbox'], ['onedrive', 'OneDrive'], ['icloud', 'iCloud Drive'],
  ['mobile documents', 'iCloud Drive'], ['google drive', 'Google Drive'], ['googledrive', 'Google Drive'],
  ['my drive', 'Google Drive'], ['syncthing', 'Syncthing'], ['nextcloud', 'Nextcloud'], ['pcloud', 'pCloud'],
  ['cloudstorage', 'a synced folder']];

function osOf(nav) {
  const p = ((nav.userAgentData && nav.userAgentData.platform) || nav.platform || nav.userAgent || '').toLowerCase();
  return p.includes('mac') || p.includes('darwin') ? 'macos' : p.includes('win') ? 'windows' : 'linux';
}

// The TeamCamel folder, from this file's own address (.../TeamCamel/web/index.html); null if the
// file is not in a web folder.
function folderOf(loc, os) {
  let p;
  try { p = decodeURIComponent(loc.pathname); } catch (e) { return null; }
  const m = p.match(/^(.*)\/web\/[^\/]*$/);
  if (!m || !m[1]) return null;
  p = m[1];
  if (os !== 'windows') return loc.host ? '//' + loc.host + p : p;
  p = p.replace(/^\/([A-Za-z]:)/, '$1').replace(/\//g, '\\');
  return loc.host ? '\\\\' + loc.host + p : p;     // a network share: file://server/share/...
}

function syncedIn(folder) {
  const f = (folder || '').toLowerCase();
  const hit = SYNCED.find(([word]) => f.includes(word));
  return hit ? hit[1] : null;
}

const shq = s => "'" + s.replace(/'/g, "'\\''") + "'";      // one shell word, whatever the path holds

// The check and install commands for this computer and folder.
function commands(os, folder) {
  if (os === 'windows') {
    const cd = folder ? 'cd /d "' + folder + '" && ' : '';
    return { check: null, install: cd + 'python teamcamel.py --install-hook' };
  }
  const cd = folder ? 'cd ' + shq(folder) + ' && ' : '';
  return { check: cd + 'sh precheck.sh', install: cd + 'python3 teamcamel.py --install-hook' };
}

function guideAddress() {
  const port = Number(new URLSearchParams(location.search).get('port')) || 2263;
  return 'http://127.0.0.1:' + port + '/';
}

// Whether TeamCamel answers on this computer. The answer itself stays unreadable to a file page;
// only whether anything answered is known.
async function answering(address) {
  try { await fetch(address + 'api/state', { mode: 'no-cors', cache: 'no-store' }); return true; }
  catch (e) { return false; }
}

async function copyText(text, button) {
  let done = false;
  try { await navigator.clipboard.writeText(text); done = true; } catch (e) {}
  if (!done) {
    const t = el('textarea'); t.value = text; document.body.append(t); t.select();
    try { done = document.execCommand('copy'); } catch (e) {}
    t.remove();
  }
  button.textContent = done ? 'Copied' : 'Select it and copy';
  setTimeout(() => { button.textContent = 'Copy'; }, 2500);
}

function cmdEl(text) {
  const box = el('div', 'cmd'), code = el('code', '', text), button = el('button', '', 'Copy');
  button.type = 'button';
  button.addEventListener('click', () => copyText(text, button));
  box.append(code, button);
  return box;
}

function link(address) {
  const a = el('a', '', address);
  a.href = address;
  return a;
}

function guide() {
  const os = osOf(navigator), folder = folderOf(location, os), address = guideAddress();
  const cmds = commands(os, folder), synced = syncedIn(folder);
  const enter = os === 'macos' ? 'Return' : 'Enter';
  document.title = 'Set up TeamCamel';
  document.getElementById('bar').hidden = true;
  const g = el('div', 'guide'), main = document.getElementById('nodes');
  main.className = '';
  main.replaceChildren(g);

  g.append(el('h1', '', 'Set up TeamCamel'),
           el('p', 'lead', 'This page was opened as a file. Once TeamCamel is set up, it shows your sessions at its own address.'));
  const state = el('p', 'state', 'Checking whether TeamCamel runs on this computer…');
  g.append(state);

  g.append(el('h2', '', '1. Put the folder where it will stay'));
  if (folder) {
    const shown = os === 'windows' ? folder : folder.replace(/^\/(Users|home)\/[^\/]+/, '~');
    g.append(el('p', 'where', 'This folder: ' + shown));
  } else {
    g.append(el('p', 'warn', 'Open this file from the web folder inside the TeamCamel folder; the commands below then come with the folder filled in.'));
  }
  if (synced) {
    g.append(el('p', '', 'It is in ' + synced + '. Every computer that sets up TeamCamel from this same folder appears on the page.'));
  } else if (folder) {
    const w = el('p', 'warn');
    w.append(el('b', '', 'Only this computer will show from here. '),
             'To see several computers on one page, first move the TeamCamel folder into a folder that syncs between them ' +
             '(Dropbox, iCloud Drive, OneDrive or Google Drive), use that same folder on every computer, and open ' +
             'web/index.html again from its new place.');
    g.append(w);
    if (/[\/\\]downloads[\/\\]/i.test(folder + '\\')) {
      g.append(el('p', 'note', 'For one computer, your home folder is a better place than Downloads, which is often cleared out.'));
    }
  }

  g.append(el('h2', '', '2. Check that everything is there'));
  if (os === 'windows') {
    g.append(el('p', '', 'Double-click precheck.bat in the TeamCamel folder.'));
  } else {
    g.append(el('p', '', os === 'macos'
      ? 'Open Terminal (press Cmd + Space, type Terminal, press Return). Paste this and press Return:'
      : 'Open a terminal, paste this and press Enter:'));
    g.append(cmdEl(cmds.check));
  }
  g.append(el('p', 'note', 'Every line should say OK; anything MISSING comes with what to do about it. The check changes nothing.'));

  g.append(el('h2', '', '3. Install, once on each computer'));
  g.append(el('p', '', os === 'windows'
    ? 'Open Command Prompt (press the Windows key, type cmd, press Enter). Paste this and press Enter:'
    : 'Paste this and press ' + enter + ':'));
  g.append(cmdEl(cmds.install));
  if (os === 'windows') g.append(el('p', 'note', 'If it says python is not found, change python to py and try again.'));
  g.append(el('p', 'note', 'This adds one start-up line to Claude’s settings file, after saving a backup of it, so that ' +
                           'TeamCamel starts with every Claude session. It also starts TeamCamel now.'));

  g.append(el('h2', '', '4. Open your page'));
  const open = el('p', 'open');
  g.append(open);
  g.append(el('p', 'note', 'Another computer: do steps 2 and 3 there too, from the same synced folder. ' +
                           'Each computer then appears on every computer’s page.'));

  let timer = null, isUp = false;
  const waiting = () => {
    open.replaceChildren('Waiting for TeamCamel to start… Already set up? Open ', link(address));
  };
  const up = () => {
    isUp = true;
    state.className = 'state';
    state.replaceChildren('TeamCamel is running on this computer: ', link(address));
    open.replaceChildren('Running. Open your page and bookmark it: ', link(address));
  };
  const check = async () => {
    clearTimeout(timer);
    if (await answering(address)) { up(); return; }
    state.className = 'state no';
    state.textContent = 'TeamCamel is not running on this computer yet. Three steps, a few minutes.';
    if (!document.hidden) timer = setTimeout(check, 3000);   // until it starts; not while the tab is hidden
  };
  waiting();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !isUp) check(); });
  check();
}

if (location.protocol === 'file:') {
  guide();
} else {
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden) await refresh();
    schedule();
  });
  refresh().then(schedule);
}
</script>
</body>
</html>
